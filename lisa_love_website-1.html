<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little question for Lisa 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    overflow: hidden;
  }
  .card {
    width: min(92vw, 620px);
    padding: 40px 24px;
    text-align: center;
    background: rgba(255,255,255,.88);
    border-radius: 30px;
    box-shadow: 0 18px 50px rgba(120,50,80,.18);
  }
  h1 {
    font-size: clamp(30px, 8vw, 48px);
    margin: 0 0 14px;
    color: #3a2630;
  }
  #message {
    color: #805466;
    font-size: 18px;
    min-height: 28px;
  }
  .buttons {
    margin-top: 30px;
    min-height: 110px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  button {
    border: 0;
    border-radius: 999px;
    padding: 15px 28px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .35s ease, opacity .35s ease;
    touch-action: manipulation;
  }
  #yes {
    background: #ff6f9f;
    color: white;
    box-shadow: 0 8px 20px rgba(255,111,159,.3);
  }
  #no {
    background: #eee;
    color: #444;
  }
  #result { display: none; }
  .bears {
    position: relative;
    display: inline-block;
    font-size: 76px;
    line-height: 1;
    margin: 12px 0 25px;
    animation: cuddle 1.8s ease-in-out infinite;
  }
  .heart {
    position: absolute;
    animation: float 1.8s ease-in-out infinite;
  }
  .heart:nth-child(1) { top: -25px; left: 5px; }
  .heart:nth-child(2) { top: -5px; right: -25px; animation-delay: .4s; }
  .heart:nth-child(3) { bottom: -20px; left: 45%; animation-delay: .8s; }
  .final {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: bold;
    color: #3a2630;
    margin: 0;
  }
  .small {
    color: #805466;
    margin-top: 14px;
  }
  @keyframes cuddle {
    0%,100% { transform: scale(1) }
    50% { transform: scale(1.06) }
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); opacity: .75; }
    50% { transform: translateY(-16px) scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="questionArea">
    <h1>Lisa... do you love me? 🥺💗</h1>
    <p id="message">Choose carefully... 👀</p>

    <div class="buttons">
      <button id="yes">Yes 💗</button>
      <button id="no">No 😭</button>
    </div>
  </div>

  <div id="result">
    <div class="bears">
      🧸🤗🧸
      <span class="heart">❤️</span>
      <span class="heart">💗</span>
      <span class="heart">💕</span>
    </div>
    <p class="final">I knew you would say yes :D ❤️‍🩹</p>
    <p class="small">Hehe... I knew it 🥹💗</p>
  </div>
</div>

<script>
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const message = document.getElementById("message");
  const questionArea = document.getElementById("questionArea");
  const result = document.getElementById("result");

  let clicks = 0;

  const messages = [
    "Plsss think twice 😭",
    "Are you sure?? 🥺",
    "Lisa pleaseee 😭💗",
    "Think again... 👀",
    "NOOOO 😭 just press Yes already!",
    "Please Lisaaa 🥹",
    "The No button is disappearing 😭",
    "Okay okay... PLEASEEEE 💗"
  ];

  no.addEventListener("click", () => {
    clicks++;

    message.textContent = messages[(clicks - 1) % messages.length];

    const yesSize = Math.min(1 + clicks * 0.18, 2.5);
    const noSize = Math.max(1 - clicks * 0.12, 0.18);

    yes.style.transform = `scale(${yesSize})`;
    no.style.transform = `scale(${noSize})`;
    no.style.opacity = Math.max(0.35, 1 - clicks * 0.08);
  });

  yes.addEventListener("click", () => {
    questionArea.style.display = "none";
    result.style.display = "block";
  });
</script>

</body>
</html>
